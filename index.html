<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Krishna</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        .hero {
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(
                110deg,
                #ffd56e 0%,
                #f8bb3c 45%,
                #e99600 100%
            );
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 7%;
            overflow: hidden;
        }

        .hero-container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 380px 1fr;
            align-items: center;
            gap: 100px;
        }

        /* Logo Section */

        .logo-box {
            width: 100%;
            max-width: 375px;
            aspect-ratio: 1 / 1;
            background: #004442;
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px;
            box-shadow: 0 18px 45px rgba(99, 67, 0, 0.12);
            margin: auto;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Content Section */

        .hero-content {
            color: #fff;
        }

        .hero-content h1 {
            font-size: clamp(32px, 3vw, 48px);
            line-height: 1.65;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 3px 5px rgba(74, 50, 0, 0.22);
            margin-bottom: 12px;
        }

        .hero-content p {
            font-size: 21px;
            line-height: 1.85;
            font-weight: 400;
            margin-bottom: 48px;
            color: #fffdf7;
        }

        /* Buttons */

        .button-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 68px;
            padding: 18px 180px;
            border-radius: 50px;
            background: #e18b00;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 20px rgba(134, 79, 0, 0.12);
            transition: transform 0.3s ease, background 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .btn:hover {
            background: #c97800;
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(134, 79, 0, 0.2);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Tablet */

        @media (max-width: 1000px) {
            .hero {
                padding: 55px 6%;
            }

            .hero-container {
                grid-template-columns: 300px 1fr;
                gap: 50px;
            }

            .logo-box {
                max-width: 300px;
                border-radius: 23px;
            }

            .hero-content h1 {
                font-size: 35px;
                line-height: 1.45;
            }

            .hero-content p {
                font-size: 17px;
                line-height: 1.8;
                margin-bottom: 30px;
            }

            .button-group {
                gap: 12px;
            }

            .btn {
                min-height: 55px;
                padding: 15px 23px;
                font-size: 15px;
            }
        }

        /* Mobile */

        @media (max-width: 700px) {
            .hero {
                min-height: 100vh;
                padding: 45px 22px;
            }

            .hero-container {
                grid-template-columns: 1fr;
                gap: 35px;
                max-width: 480px;
            }

            .logo-box {
                width: 230px;
                max-width: 100%;
                padding: 25px;
                border-radius: 23px;
            }

            .hero-content {
                text-align: center;
            }

            .hero-content h1 {
                font-size: clamp(27px, 7vw, 36px);
                line-height: 1.4;
                margin-bottom: 16px;
            }

            .hero-content p {
                font-size: 16px;
                line-height: 1.8;
                margin-bottom: 28px;
            }

            .button-group {
                flex-direction: column;
                width: 100%;
                gap: 14px;
            }

            .btn {
                width: 100%;
                max-width: 320px;
                min-height: 56px;
                padding: 15px 20px;
                font-size: 16px;
            }
        }

        /* Small Mobile */

        @media (max-width: 380px) {
            .hero {
                padding: 35px 16px;
            }

            .logo-box {
                width: 190px;
                border-radius: 20px;
            }

            .hero-content h1 {
                font-size: 27px;
            }

            .hero-content p {
                font-size: 14px;
            }

            .btn {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="hero-container">

            <!-- Left Logo -->
            <div class="logo-box">
                <img src="kr.png" alt="Maya 24 Logo">
            </div>

            <!-- Right Content -->
            <div class="hero-content">

                <h1>
                    Download India's Best<br>
                    Krishna  Application
                </h1>

                <p>
                    Pl@y up to Lacs Daily with Maya 24 G@me -
                    Safe, Secure &amp; Fast
                </p>

                <div class="button-group">

                    <a href="KRISHNA 95.apk" class="btn">
                        Download APK
                    </a>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
